# MonitorX — Docker Compose deployment.
#
# Bring up:
#   docker compose up -d --build
#
# The image is a deployment format only. MonitorX does not invoke Docker or
# kubectl CLIs and does not mount the Docker socket. Mount libvirt only when VM
# monitoring is required (guest control still needs the host-side policy).
services:
  monitorx:
    build: .
    image: monitorx:latest
    container_name: monitorx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - monitorx-data:/app/data
      # Host libvirt socket — enables VM monitoring (mount only if libvirtd runs).
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock:ro
    environment:
      # Containers must listen on their network interface; localhost remains
      # the default for direct host launches.
      MONITORX_HOST: "0.0.0.0"
      MONITORX_AUTH_TOKEN: "${MONITORX_AUTH_TOKEN:-}"
      MONITORX_LIBVIRT_URI: "qemu:///system"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  monitorx-data:
